{% extends "dadjokes/base.html" %}
{% block content %}
    <h1>All Pictures</h1>
    
    {% for picture in pictures %}
        <div>
        <a href="{% url 'dadjokes:picture' picture.pk %}">
            <img
                src="{{ picture.image_url }}"
                width="300"
            >
        </a>
        </div>

    {% empty %}
        <p>No picture yet</p>
    {% endfor %}
{% endblock %}
