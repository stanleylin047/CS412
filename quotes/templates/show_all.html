{% extends "base.html" %}

{% block content %}
    <h2>All Quotes</h2>
    <ul>
    {% for quote in quotes %}
        <li>{{ quote }}</li>
    {% endfor %}
    </ul>
    <div class="gallery">
    {% for image in images %}
        <img src="{{ image }}" alt="Portrait of YOUR PERSON">
    {% endfor %}
    </div>
{% endblock %}
