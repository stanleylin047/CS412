{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Insta</title>
    <link rel="stylesheet" href="{% static 'mini_insta/style.css' %}">
</head>
<body>
    <header>
        <h1>Mini Insta</h1>
        <nav>
            <a href="{% url 'mini_insta:show_all_profiles' %}">All Profiles</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Mini Insta · CS412</p>
        <a href="{% url 'mini_insta:show_all_profiles' %}">Back to all profiles</a>
        
        {% if profile %}
            <a href="{% url 'mini_insta:create_post' profile.pk %}">
                Create Post
            </a>
        {% endif %}
    </footer>
</body>
</html>
