{% extends "mini_insta/base.html" %}

{% block content %}
<h1>Update {{ profile.display_name }}</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save Changes</button>
</form>

<a href="{% url 'mini_insta:show_profile' profile.pk %}">
    Cancel
</a>
{% endblock %}
